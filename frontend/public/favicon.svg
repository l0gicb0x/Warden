<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1c1a17" />
      <stop offset="50%" stopColor="#12110f" />
      <stop offset="100%" stopColor="#080807" />
    </linearGradient>

    <!-- Shield Wing Amber Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.4" />
      <stop offset="50%" stopColor="#d97706" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#b45309" stopOpacity="0.05" />
    </linearGradient>

    <!-- Sentry Laser Spine Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="50%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>

    <!-- Glow Filter for High Visibility at 16px/32px -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" stroke="#d97706" stroke-width="3" stroke-opacity="0.6" />

  <!-- Subtle Inner Ambient Pulse -->
  <circle cx="64" cy="64" r="42" fill="#d97706" fill-opacity="0.08" />

  <!-- Outer Facet Stealth Wings (Bat-Shield Monogram) -->
  <path
    d="M 16 34 
       L 42 34 
       L 54 62 
       L 64 26 
       L 74 62 
       L 86 34 
       L 112 34 
       L 96 74 
       L 64 104 
       L 32 74 
       Z"
    fill="url(#shieldGrad)"
    stroke="#f59e0b"
    stroke-width="4.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Mid-Armor Facets for Crisp Contrast -->
  <path
    d="M 28 44 L 46 44 L 56 68 L 64 38 L 72 68 L 82 44 L 100 44 L 88 72 L 64 92 L 40 72 Z"
    stroke="#fbbf24"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-opacity="0.9"
  />

  <!-- Central Sentry Core Laser Spine -->
  <line x1="64" y1="26" x2="64" y2="104" stroke="url(#spineGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Gleaming Core Node -->
  <circle cx="64" cy="62" r="7" fill="#ffffff" filter="url(#amberGlow)" />
  <circle cx="64" cy="62" r="3.5" fill="#fef08a" />
</svg>